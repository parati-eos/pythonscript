<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Cleaner</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px 60px;
    }

    .card {
      background: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 700px;
      padding: 36px 32px;
    }

    h1 { font-size: 1.5rem; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; }
    .subtitle { font-size: 0.875rem; color: #6b7280; margin-bottom: 28px; }

    /* ── Drop zone ── */
    .drop-zone {
      border: 2px dashed #c4c9d4;
      border-radius: 10px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      background: #fafbfc;
    }
    .drop-zone.drag-over { border-color: #4f46e5; background: #eef2ff; }
    .drop-zone svg { margin-bottom: 10px; color: #9ca3af; }
    .drop-zone p { font-size: 0.9rem; color: #6b7280; }
    .drop-zone span { color: #4f46e5; font-weight: 600; }
    .drop-zone .hint { font-size: 0.78rem; color: #9ca3af; margin-top: 6px; }
    #file-input { display: none; }

    /* ── PDF cards ── */
    #cards-container { display: flex; flex-direction: column; gap: 14px; margin-top: 20px; }

    .pdf-card {
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      overflow: hidden;
    }

    .pdf-card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
    }
    .card-icon { font-size: 1.1rem; flex-shrink: 0; }
    .card-name {
      flex: 1;
      font-size: 0.875rem;
      font-weight: 600;
      color: #374151;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .card-remove {
      background: none; border: none; cursor: pointer;
      color: #9ca3af; font-size: 1.1rem; line-height: 1;
      padding: 2px 4px; flex-shrink: 0;
      transition: color 0.15s;
    }
    .card-remove:hover { color: #ef4444; }

    .pdf-card-body { padding: 14px; }

    /* ── Height controls (per card) ── */
    .card-height-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }
    .card-height-row label {
      font-size: 0.8rem;
      font-weight: 600;
      color: #374151;
      white-space: nowrap;
    }
    .h-btn {
      width: 28px; height: 28px;
      border: 1px solid #d1d5db; border-radius: 6px;
      background: #fff; cursor: pointer;
      font-size: 1rem; font-weight: 700; color: #374151;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.15s; flex-shrink: 0;
    }
    .h-btn:hover { background: #f3f4f6; }
    .h-input {
      width: 68px; padding: 5px 6px;
      border: 1px solid #d1d5db; border-radius: 6px;
      font-size: 0.85rem; text-align: center;
      -moz-appearance: textfield;
    }
    .h-input::-webkit-outer-spin-button,
    .h-input::-webkit-inner-spin-button { -webkit-appearance: none; }
    .h-input:focus { outline: none; border-color: #4f46e5; }
    .detect-btn {
      padding: 5px 10px;
      border: 1px solid #4f46e5; border-radius: 6px;
      background: #fff; color: #4f46e5;
      font-size: 0.78rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s; white-space: nowrap;
    }
    .detect-btn:hover { background: #eef2ff; }
    .detect-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .card-hint { font-size: 0.75rem; color: #9ca3af; margin-bottom: 10px; }

    /* ── Per-card preview ── */
    .card-preview-wrap {
      position: relative;
      border: 1px solid #e5e7eb;
      border-radius: 6px;
      overflow: hidden;
      background: #e5e7eb;
      max-height: 280px;
      overflow-y: auto;
    }
    .card-preview-wrap canvas { display: block; width: 100%; height: auto; }
    .preview-loading {
      display: flex; align-items: center; justify-content: center;
      height: 80px;
      font-size: 0.82rem; color: #9ca3af;
      background: #f3f4f6;
    }
    .cut-line {
      position: absolute; left: 0; width: 100%;
      height: 2px; background: #ef4444;
      display: none; z-index: 2; pointer-events: none;
    }
    .cut-label {
      position: absolute; right: 8px;
      background: #ef4444; color: #fff;
      font-size: 0.68rem; font-weight: 700;
      padding: 2px 6px; border-radius: 4px;
      transform: translateY(-100%);
      white-space: nowrap;
    }
    .cut-overlay {
      position: absolute; left: 0; width: 100%;
      background: rgba(239,68,68,0.13);
      display: none; z-index: 1; pointer-events: none;
    }

    /* Header logo zone indicator — matches backend: right 15% × top 12% */
    .logo-zone {
      position: absolute; right: 0; top: 0;
      width: 15%; height: 12%;
      background: rgba(79,70,229,0.15);
      border: 2px solid rgba(79,70,229,0.6);
      border-top: none; border-right: none;
      display: none; z-index: 2; pointer-events: none;
    }
    .logo-zone-label {
      position: absolute; bottom: 4px; left: 6px;
      background: #4f46e5; color: #fff;
      font-size: 0.65rem; font-weight: 700;
      padding: 2px 5px; border-radius: 4px;
      white-space: nowrap;
    }

    /* ── Process button ── */
    #process-btn {
      margin-top: 24px; width: 100%; padding: 12px;
      background: #4f46e5; color: #fff;
      border: none; border-radius: 8px;
      font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: background 0.2s, opacity 0.2s;
    }
    #process-btn:disabled { opacity: 0.5; cursor: not-allowed; }
    #process-btn:not(:disabled):hover { background: #4338ca; }

    /* ── Results ── */
    #results { margin-top: 28px; display: flex; flex-direction: column; gap: 10px; }
    .result-row {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: 8px;
      background: #f9fafb; border: 1px solid #e5e7eb;
      font-size: 0.875rem; flex-wrap: wrap;
    }
    .result-row .filename {
      flex: 1; overflow: hidden;
      text-overflow: ellipsis; white-space: nowrap;
      color: #374151; font-weight: 500; min-width: 0;
    }
    .badge {
      padding: 3px 10px; border-radius: 20px;
      font-size: 0.78rem; font-weight: 600; white-space: nowrap;
    }
    .badge.processing { background: #fef3c7; color: #b45309; }
    .badge.done       { background: #d1fae5; color: #065f46; }
    .badge.error      { background: #fee2e2; color: #991b1b; }
    .download-btn {
      padding: 5px 14px; background: #4f46e5; color: #fff;
      border: none; border-radius: 6px;
      font-size: 0.8rem; font-weight: 600;
      cursor: pointer; text-decoration: none;
      white-space: nowrap; transition: background 0.2s;
    }
    .download-btn:hover { background: #4338ca; }
    .spinner {
      width: 16px; height: 16px; flex-shrink: 0;
      border: 2px solid #d1d5db; border-top-color: #b45309;
      border-radius: 50%; animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .error-msg { font-size: 0.75rem; color: #ef4444; width: 100%; }
  </style>
</head>
<body>
<div class="card">
  <h1>PDF Cleaner</h1>
  <p class="subtitle">Removes footer and top-right header logo from every page — set footer height per file.</p>

  <div class="drop-zone" id="drop-zone">
    <svg width="36" height="36" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round"
        d="M12 16v-8m0 0-3 3m3-3 3 3M6.75 19.5H17.25A2.25 2.25 0 0019.5 17.25v-9a2.25 2.25 0 00-2.25-2.25H6.75A2.25 2.25 0 004.5 8.25v9A2.25 2.25 0 006.75 19.5z"/>
    </svg>
    <p>Drag &amp; drop PDFs here, or <span id="browse-link">browse</span></p>
    <p class="hint">Multiple files supported &middot; PDF only</p>
    <input type="file" id="file-input" accept=".pdf" multiple />
  </div>

  <div id="cards-container"></div>

  <button id="process-btn" disabled>Process PDFs</button>
  <div id="results"></div>
</div>

<script>
  const PDFJS_CDN = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174';
  pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS_CDN + '/pdf.worker.min.js';

  // ── State ─────────────────────────────────────────────────────────────────
  // Map: fid (int) → { file, pageHeight, scale }
  const files = new Map();
  let fidCounter = 0;

  const dropZone       = document.getElementById('drop-zone');
  const fileInput      = document.getElementById('file-input');
  const browseLink     = document.getElementById('browse-link');
  const cardsContainer = document.getElementById('cards-container');
  const processBtn     = document.getElementById('process-btn');
  const results        = document.getElementById('results');

  // ── Drop zone ─────────────────────────────────────────────────────────────
  browseLink.addEventListener('click', () => fileInput.click());
  dropZone.addEventListener('click', e => { if (e.target !== browseLink) fileInput.click(); });
  fileInput.addEventListener('change', () => { addFiles(fileInput.files); fileInput.value = ''; });
  dropZone.addEventListener('dragover',  e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    addFiles(e.dataTransfer.files);
  });

  // ── Add files ─────────────────────────────────────────────────────────────
  function addFiles(fileList) {
    for (const f of fileList) {
      if (f.type !== 'application/pdf') continue;
      if ([...files.values()].find(s => s.file.name === f.name && s.file.size === f.size)) continue;

      const fid = fidCounter++;
      files.set(fid, { file: f, pageHeight: 0, scale: 1 });

      const card = buildCard(fid, f);
      cardsContainer.appendChild(card);

      // Wire events after card is in DOM
      document.getElementById(`fh-${fid}`).addEventListener('input', () => updateCutLine(fid));
      document.getElementById(`bminus-${fid}`).addEventListener('click', () => adjustHeight(fid, -1));
      document.getElementById(`bplus-${fid}`).addEventListener('click', () => adjustHeight(fid, 1));
      document.getElementById(`detect-${fid}`).addEventListener('click', () => detectHeight(fid));

      renderPreview(fid);
    }
    processBtn.disabled = files.size === 0;
  }

  // ── Build card DOM ────────────────────────────────────────────────────────
  function buildCard(fid, file) {
    const card = document.createElement('div');
    card.className = 'pdf-card';
    card.id = `card-${fid}`;

    // Header
    const header = document.createElement('div');
    header.className = 'pdf-card-header';

    const icon = document.createElement('span');
    icon.className = 'card-icon';
    icon.textContent = '📄';

    const nameSpan = document.createElement('span');
    nameSpan.className = 'card-name';
    nameSpan.textContent = file.name;
    nameSpan.title = file.name;

    const removeBtn = document.createElement('button');
    removeBtn.className = 'card-remove';
    removeBtn.textContent = '✕';
    removeBtn.title = 'Remove';
    removeBtn.addEventListener('click', () => removeFile(fid));

    header.append(icon, nameSpan, removeBtn);

    // Body
    const body = document.createElement('div');
    body.className = 'pdf-card-body';
    body.innerHTML = `
      <div class="card-height-row">
        <label>Footer height (pts)</label>
        <button class="h-btn" id="bminus-${fid}">&#8722;</button>
        <input type="number" class="h-input" id="fh-${fid}" min="0" max="600" placeholder="Auto" />
        <button class="h-btn" id="bplus-${fid}">&#43;</button>
        <button class="detect-btn" id="detect-${fid}">Auto-detect</button>
      </div>
      <p class="card-hint" id="hint-${fid}">Leave empty to auto-detect. Red line shows the cut position.</p>
      <div class="card-preview-wrap" id="wrap-${fid}">
        <div class="preview-loading" id="pload-${fid}">Rendering preview…</div>
        <canvas id="pcanvas-${fid}"></canvas>
        <div class="logo-zone" id="lzone-${fid}"><span class="logo-zone-label">Header logo removed</span></div>
        <div class="cut-line" id="cline-${fid}"><span class="cut-label" id="clabel-${fid}"></span></div>
        <div class="cut-overlay" id="coverlay-${fid}"></div>
      </div>`;

    card.append(header, body);
    return card;
  }

  // ── Remove file ───────────────────────────────────────────────────────────
  function removeFile(fid) {
    files.delete(fid);
    document.getElementById(`card-${fid}`)?.remove();
    processBtn.disabled = files.size === 0;
  }

  // ── PDF.js preview ────────────────────────────────────────────────────────
  async function renderPreview(fid) {
    const state = files.get(fid);
    if (!state) return;

    const loading = document.getElementById(`pload-${fid}`);
    const canvas  = document.getElementById(`pcanvas-${fid}`);
    const wrap    = document.getElementById(`wrap-${fid}`);

    loading.style.display = 'flex';
    canvas.style.display  = 'none';
    hideCutLine(fid);

    try {
      const buf  = await state.file.arrayBuffer();
      const pdf  = await pdfjsLib.getDocument({ data: buf }).promise;
      const page = await pdf.getPage(1);

      const vp1 = page.getViewport({ scale: 1 });
      state.pageHeight = vp1.height;

      const w = wrap.clientWidth || 620;
      state.scale = w / vp1.width;
      const vp = page.getViewport({ scale: state.scale });

      canvas.width  = vp.width;
      canvas.height = vp.height;
      canvas.style.display = 'block';

      await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
      loading.style.display = 'none';
      // Show header logo zone indicator (top-right 30% × 15%)
      const lzone = document.getElementById(`lzone-${fid}`);
      if (lzone) lzone.style.display = 'block';
      updateCutLine(fid);
    } catch {
      loading.textContent = 'Could not render preview.';
    }
  }

  // ── Cut line ──────────────────────────────────────────────────────────────
  function updateCutLine(fid) {
    const state   = files.get(fid);
    const canvas  = document.getElementById(`pcanvas-${fid}`);
    const cline   = document.getElementById(`cline-${fid}`);
    const clabel  = document.getElementById(`clabel-${fid}`);
    const coverlay= document.getElementById(`coverlay-${fid}`);

    if (!state?.pageHeight) { hideCutLine(fid); return; }

    const val = parseFloat(document.getElementById(`fh-${fid}`)?.value);
    if (!val || val <= 0) { hideCutLine(fid); return; }

    const cutY = (state.pageHeight - val) * state.scale;
    if (cutY < 0 || cutY > canvas.height) { hideCutLine(fid); return; }

    cline.style.display   = 'block';
    cline.style.top       = cutY + 'px';
    clabel.textContent    = val + ' pts';
    coverlay.style.display = 'block';
    coverlay.style.top    = cutY + 'px';
    coverlay.style.height = (canvas.height - cutY) + 'px';
  }

  function hideCutLine(fid) {
    const cline   = document.getElementById(`cline-${fid}`);
    const coverlay= document.getElementById(`coverlay-${fid}`);
    if (cline)    cline.style.display    = 'none';
    if (coverlay) coverlay.style.display = 'none';
  }

  function hideLogoZone(fid) {
    const lzone = document.getElementById(`lzone-${fid}`);
    if (lzone) lzone.style.display = 'none';
  }

  // ── Height controls ───────────────────────────────────────────────────────
  function adjustHeight(fid, delta) {
    const input = document.getElementById(`fh-${fid}`);
    if (!input) return;
    input.value = Math.max(0, (parseInt(input.value) || 0) + delta);
    updateCutLine(fid);
  }

  async function detectHeight(fid) {
    const state = files.get(fid);
    if (!state) return;
    const btn  = document.getElementById(`detect-${fid}`);
    const hint = document.getElementById(`hint-${fid}`);
    btn.disabled    = true;
    btn.textContent = 'Detecting…';
    try {
      const form = new FormData();
      form.append('file', state.file);
      const resp = await fetch('/detect-height', { method: 'POST', body: form });
      const data = await resp.json();
      if (data.footer_height_pts !== undefined) {
        const pts = Math.round(data.footer_height_pts);
        document.getElementById(`fh-${fid}`).value = pts > 0 ? pts : '';
        updateCutLine(fid);
        hint.textContent = pts > 0
          ? `Auto-detected: ${pts} pts from bottom.`
          : 'No footer detected. Enter manually if needed.';
      }
    } catch {
      hint.textContent = 'Auto-detect failed. Try manually.';
    } finally {
      btn.disabled    = false;
      btn.textContent = 'Auto-detect';
    }
  }

  // ── Process ───────────────────────────────────────────────────────────────
  processBtn.addEventListener('click', async () => {
    if (files.size === 0) return;

    processBtn.disabled = true;
    results.innerHTML   = '';

    const entries = [...files.entries()]; // [[fid, state], ...]

    // Build results rows
    const rowMap = {};
    entries.forEach(([fid, state]) => {
      const row = createResultRow(state.file.name);
      results.appendChild(row.el);
      rowMap[state.file.name] = row;
    });

    // Build form data
    const form    = new FormData();
    const heights = [];
    entries.forEach(([fid, state]) => {
      form.append('files', state.file);
      const h = parseInt(document.getElementById(`fh-${fid}`)?.value);
      heights.push(isNaN(h) ? null : h);
    });
    form.append('footer_heights', JSON.stringify(heights));

    // Clear cards
    files.clear();
    cardsContainer.innerHTML = '';

    try {
      const resp = await fetch('/process', { method: 'POST', body: form });
      if (!resp.ok) throw new Error(`Server error ${resp.status}`);

      const reader  = resp.body.getReader();
      const decoder = new TextDecoder();
      let buf = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buf += decoder.decode(value, { stream: true });
        const lines = buf.split('\n');
        buf = lines.pop();
        for (const line of lines) {
          if (!line.trim()) continue;
          try {
            const msg = JSON.parse(line);
            updateResultRow(rowMap[msg.name], msg);
          } catch (_) {}
        }
      }
    } catch (err) {
      const errEl = document.createElement('div');
      errEl.className   = 'result-row';
      errEl.style.color = '#ef4444';
      errEl.textContent = 'Upload failed: ' + err.message;
      results.appendChild(errEl);
    }
  });

  // ── Result row helpers ────────────────────────────────────────────────────
  function createResultRow(name) {
    const el = document.createElement('div');
    el.className = 'result-row';
    const nameEl = document.createElement('span');
    nameEl.className = 'filename';
    nameEl.textContent = name;
    nameEl.title = name;
    const badge = document.createElement('span');
    badge.className   = 'badge processing';
    badge.textContent = 'Queued';
    el.append(nameEl, badge);
    return { el, badge };
  }

  function updateResultRow(row, msg) {
    if (!row) return;
    row.el.querySelector('.spinner')?.remove();

    if (msg.status === 'processing') {
      const sp = document.createElement('div');
      sp.className = 'spinner';
      row.el.insertBefore(sp, row.el.querySelector('.filename'));
      row.badge.className   = 'badge processing';
      row.badge.textContent = 'Processing…';
    } else if (msg.status === 'done') {
      row.badge.className   = 'badge done';
      row.badge.textContent = 'Done ✓';
      const a = document.createElement('a');
      a.className   = 'download-btn';
      a.href        = msg.download_url;
      a.download    = '';
      a.textContent = 'Download';
      row.el.appendChild(a);
    } else if (msg.status === 'error') {
      row.badge.className   = 'badge error';
      row.badge.textContent = 'Error';
      const em = document.createElement('div');
      em.className   = 'error-msg';
      em.textContent = msg.error || 'Unknown error';
      row.el.appendChild(em);
    }
  }
</script>
</body>
</html>
